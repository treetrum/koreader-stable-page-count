name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes liblua5.1-0-dev luajit luarocks
          sudo luarocks --lua-version=5.1 install luacheck

      - name: Lint
        run: luacheck pagecount.koplugin tests

      - name: Test
        run: luajit tests/pagecount_spec.lua
